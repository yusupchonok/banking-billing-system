openapi: 3.0.3

info:
  title: Banking Billing System API
  version: 1.0.0
  description: API для расчёта комиссии и работы с биллинговыми операциями.

servers:
  - url: https://api.example.com

paths:
  /api/v1/billing-operations/{operationId}:
    parameters:
      - name: operationId
        in: path
        required: true
        description: Идентификатор биллинговой операции
        schema:
          type: string
          minLength: 1
          maxLength: 64
        example: billing-70001

    get:
      summary: Получить биллинговую операцию
      security:
        - OAuth2:
            - billing.read
      responses:
        '200':
          description: Операция найдена
          headers:
            ETag:
              description: Текущая версия ресурса
              schema:
                type: string
              example: '"1"'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingOperationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/billing-operations:
    get:
      summary: Получить список биллинговых операций
      security:
        - OAuth2:
            - billing.read
      parameters:
        - name: clientId
          in: query
          required: false
          description: Фильтр по клиенту
          schema:
            type: string
            minLength: 1
            maxLength: 64
        - name: status
          in: query
          required: false
          description: Фильтр по статусу
          schema:
            type: string
            enum:
              - CALCULATED
              - REJECTED
              - COMPLETED
              - CANCELLED
              - ERROR
        - name: page
          in: query
          required: false
          description: Номер страницы
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          description: Количество элементов на странице
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Список биллинговых операций
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingOperationListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      summary: Рассчитать комиссию
      description: Рассчитывает комиссию и проверяет возможность её списания до выполнения денежной операции.
      security:
        - OAuth2:
            - billing.write
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Ключ защиты от повторного выполнения POST-запроса
          schema:
            type: string
            minLength: 8
            maxLength: 64
          example: billing-12345
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillingOperationCreateRequest'
            example:
              externalOperationId: transfer-10001
              clientId: client-101
              accountId: account-501
              operationType: TRANSFER
              operationAmount: 15000.00
              operationCurrency: RUB
              operationDate: '2026-08-17T10:00:00Z'
      responses:
        '200':
          description: Комиссия рассчитана
          headers:
            ETag:
              description: Текущая версия ресурса
              schema:
                type: string
              example: '"1"'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingOperationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

    patch:
      summary: Зафиксировать результат денежной операции
      description: После выполнения перевода фиксирует его результат и завершает работу с комиссией.
      security:
        - OAuth2:
            - billing.write
      parameters:
        - name: If-Match
          in: header
          required: true
          description: ETag текущей версии ресурса
          schema:
            type: string
            minLength: 1
            maxLength: 64
          example: '"1"'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillingOperationPatchRequest'
            example:
              transferStatus: COMPLETED
      responses:
        '200':
          description: Результат операции зафиксирован
          headers:
            ETag:
              description: Новая версия ресурса
              schema:
                type: string
              example: '"2"'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingOperationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '423':
          $ref: '#/components/responses/Locked'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

components:
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://auth.example.com/oauth2/token
          scopes:
            billing.read: Чтение биллинговых операций
            billing.write: Создание и изменение биллинговых операций

  schemas:
    BillingOperationCreateRequest:
      type: object
      additionalProperties: false
      required:
        - externalOperationId
        - clientId
        - accountId
        - operationType
        - operationAmount
        - operationCurrency
        - operationDate
      properties:
        externalOperationId:
          type: string
          minLength: 1
          maxLength: 64
          example: transfer-10001
        clientId:
          type: string
          minLength: 1
          maxLength: 64
          example: client-101
        accountId:
          type: string
          minLength: 1
          maxLength: 64
          example: account-501
        operationType:
          type: string
          enum:
            - TRANSFER
            - PAYMENT
            - CASH_WITHDRAWAL
          example: TRANSFER
        operationAmount:
          type: number
          format: double
          minimum: 0.01
          maximum: 999999999999.99
          multipleOf: 0.01
          example: 15000.00
        operationCurrency:
          type: string
          minLength: 3
          maxLength: 3
          pattern: '^[A-Z]{3}$'
          example: RUB
        operationDate:
          type: string
          format: date-time
          example: '2026-08-17T10:00:00Z'

    BillingOperationPatchRequest:
      type: object
      additionalProperties: false
      required:
        - transferStatus
      properties:
        transferStatus:
          type: string
          enum:
            - COMPLETED
            - FAILED
          example: COMPLETED

    BillingOperationResponse:
      type: object
      additionalProperties: false
      required:
        - operationId
        - externalOperationId
        - status
        - billingDecision
        - commissionAmount
        - commissionCurrency
        - chargeStatus
        - _links
      properties:
        operationId:
          type: string
          minLength: 1
          maxLength: 64
          example: billing-70001
        externalOperationId:
          type: string
          minLength: 1
          maxLength: 64
          example: transfer-10001
        status:
          type: string
          enum:
            - CALCULATED
            - REJECTED
            - COMPLETED
            - CANCELLED
            - ERROR
          example: CALCULATED
        billingDecision:
          type: string
          enum:
            - APPROVED
            - REJECTED
          example: APPROVED
        decisionReason:
          type: string
          enum:
            - INSUFFICIENT_FUNDS
            - ACCOUNT_BLOCKED
            - ACCOUNT_CLOSED
            - TARIFF_NOT_FOUND
        commissionAmount:
          type: number
          format: double
          minimum: 0
          maximum: 999999999999.99
          multipleOf: 0.01
          example: 150.00
        commissionCurrency:
          type: string
          minLength: 3
          maxLength: 3
          pattern: '^[A-Z]{3}$'
          example: RUB
        chargeStatus:
          type: string
          enum:
            - NO_CHARGE
            - RESERVED
            - PAID
            - NOT_CHARGED
            - PAYMENT_ERROR
          example: RESERVED
        _links:
          $ref: '#/components/schemas/OperationLinks'

    OperationLinks:
      type: object
      additionalProperties: false
      required:
        - self
      properties:
        self:
          $ref: '#/components/schemas/Link'
        update:
          $ref: '#/components/schemas/Link'

    BillingOperationListResponse:
      type: object
      additionalProperties: false
      required:
        - items
        - page
        - size
        - totalElements
        - totalPages
        - _links
      properties:
        items:
          type: array
          minItems: 0
          maxItems: 100
          items:
            $ref: '#/components/schemas/BillingOperationResponse'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
        _links:
          $ref: '#/components/schemas/CollectionLinks'

    CollectionLinks:
      type: object
      additionalProperties: false
      required:
        - self
      properties:
        self:
          $ref: '#/components/schemas/Link'
        next:
          $ref: '#/components/schemas/Link'
        prev:
          $ref: '#/components/schemas/Link'

    Link:
      type: object
      additionalProperties: false
      required:
        - href
        - method
      properties:
        href:
          type: string
          minLength: 1
          maxLength: 2048
          example: /api/v1/billing-operations/billing-70001
        method:
          type: string
          enum:
            - GET
            - PATCH
            - POST
          example: GET

    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          minLength: 3
          maxLength: 64
          example: INVALID_REQUEST
        message:
          type: string
          minLength: 1
          maxLength: 500
          example: Некорректные данные запроса

  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: Не передан или недействителен токен доступа
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: Недостаточно прав для выполнения операции
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Клиент, счёт или биллинговая операция не найдены
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Conflict:
      description: Конфликт при повторном использовании Idempotency-Key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unprocessable:
      description: Операция не может быть выполнена по бизнес-правилам
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    PreconditionFailed:
      description: If-Match не соответствует текущему ETag
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Locked:
      description: Ресурс заблокирован для изменения
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    PreconditionRequired:
      description: Не передан обязательный If-Match
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    TooManyRequests:
      description: Превышен лимит запросов
      headers:
        Retry-After:
          description: Через сколько секунд можно повторить запрос
          schema:
            type: integer
            minimum: 1
            default: 30
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    InternalError:
      description: Внутренняя ошибка сервиса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    ServiceUnavailable:
      description: Сервис временно недоступен
      headers:
        Retry-After:
          description: Через сколько секунд можно повторить запрос
          schema:
            type: integer
            minimum: 1
            default: 10
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    GatewayTimeout:
      description: Не получен ответ зависимого сервиса в установленное время
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'