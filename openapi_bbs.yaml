openapi: 3.0.3

info:
  title: Banking Billing System API
  version: 1.0.0
  description: API для расчёта комиссии и фиксации результата денежной операции.

servers:
  - url: https://api.example.com

paths:
  /api/v1/billing-operations:
    post:
      summary: Рассчитать комиссию
      description: Рассчитывает комиссию и проверяет возможность её списания до выполнения денежной операции.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Ключ защиты от повторного выполнения запроса
          schema:
            type: string
            minLength: 8
            maxLength: 64
          example: billing-12345
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillingOperationCreateRequest'
            example:
              externalOperationId: transfer-10001
              clientId: client-101
              accountId: account-501
              operationType: TRANSFER
              operationAmount: 15000.00
              operationCurrency: RUB
              operationDate: '2026-08-13T10:00:00Z'
      responses:
        '200':
          description: Комиссия рассчитана
          headers:
            ETag:
              description: Текущая версия ресурса
              schema:
                type: string
              example: '"1"'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingOperationResponse'
              example:
                operationId: billing-70001
                externalOperationId: transfer-10001
                status: CALCULATED
                billingDecision: APPROVED
                commissionAmount: 150.00
                commissionCurrency: RUB
                chargeStatus: RESERVED
                _links:
                  self:
                    href: /api/v1/billing-operations/billing-70001
                    method: GET
                  update:
                    href: /api/v1/billing-operations/billing-70001
                    method: PATCH
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

  /api/v1/billing-operations/{operationId}:
    parameters:
      - name: operationId
        in: path
        required: true
        description: Идентификатор биллинговой операции
        schema:
          type: string
          minLength: 1
          maxLength: 64
        example: billing-70001

    get:
      summary: Получить биллинговую операцию
      responses:
        '200':
          description: Операция найдена
          headers:
            ETag:
              description: Текущая версия ресурса
              schema:
                type: string
              example: '"1"'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingOperationResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

    patch:
      summary: Зафиксировать результат денежной операции
      description: После выполнения перевода фиксирует его результат и завершает работу с комиссией.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Ключ защиты от повторного выполнения запроса
          schema:
            type: string
            minLength: 8
            maxLength: 64
          example: finalize-12345
        - name: If-Match
          in: header
          required: true
          description: ETag версии ресурса
          schema:
            type: string
          example: '"1"'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillingOperationPatchRequest'
            example:
              transferStatus: COMPLETED
      responses:
        '200':
          description: Результат операции зафиксирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingOperationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '423':
          $ref: '#/components/responses/Locked'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

components:
  schemas:
    BillingOperationCreateRequest:
      type: object
      additionalProperties: false
      required:
        - externalOperationId
        - clientId
        - accountId
        - operationType
        - operationAmount
        - operationCurrency
        - operationDate
      properties:
        externalOperationId:
          type: string
          minLength: 1
          maxLength: 64
          description: Идентификатор денежной операции во внешней системе
          example: transfer-10001
        clientId:
          type: string
          minLength: 1
          maxLength: 64
          description: Идентификатор клиента
          example: client-101
        accountId:
          type: string
          minLength: 1
          maxLength: 64
          description: Идентификатор счёта
          example: account-501
        operationType:
          type: string
          enum:
            - TRANSFER
            - PAYMENT
            - CASH_WITHDRAWAL
          description: Тип денежной операции
          example: TRANSFER
        operationAmount:
          type: number
          format: double
          minimum: 0.01
          maximum: 999999999999.99
          multipleOf: 0.01
          description: Сумма операции
          example: 15000.00
        operationCurrency:
          type: string
          minLength: 3
          maxLength: 3
          pattern: '^[A-Z]{3}$'
          description: Валюта операции
          example: RUB
        operationDate:
          type: string
          format: date-time
          description: Дата и время операции
          example: '2026-08-13T10:00:00Z'

    BillingOperationPatchRequest:
      type: object
      additionalProperties: false
      required:
        - transferStatus
      properties:
        transferStatus:
          type: string
          enum:
            - COMPLETED
            - FAILED
          description: Результат выполнения денежной операции
          example: COMPLETED

    BillingOperationResponse:
      type: object
      additionalProperties: false
      required:
        - operationId
        - externalOperationId
        - status
        - billingDecision
        - commissionAmount
        - commissionCurrency
        - chargeStatus
        - _links
      properties:
        operationId:
          type: string
          minLength: 1
          maxLength: 64
          description: Идентификатор биллинговой операции
          example: billing-70001
        externalOperationId:
          type: string
          minLength: 1
          maxLength: 64
          description: Идентификатор денежной операции во внешней системе
          example: transfer-10001
        status:
          type: string
          enum:
            - CALCULATED
            - REJECTED
            - COMPLETED
            - CANCELLED
            - ERROR
          description: Статус биллинговой операции
          example: CALCULATED
        billingDecision:
          type: string
          enum:
            - APPROVED
            - REJECTED
          description: Решение о возможности продолжения денежной операции
          example: APPROVED
        decisionReason:
          type: string
          enum:
            - INSUFFICIENT_FUNDS
            - ACCOUNT_BLOCKED
            - ACCOUNT_CLOSED
            - TARIFF_NOT_FOUND
          description: Причина отказа
          example: INSUFFICIENT_FUNDS
        commissionAmount:
          type: number
          format: double
          minimum: 0
          maximum: 999999999999.99
          multipleOf: 0.01
          description: Размер комиссии
          example: 150.00
        commissionCurrency:
          type: string
          minLength: 3
          maxLength: 3
          pattern: '^[A-Z]{3}$'
          description: Валюта комиссии
          example: RUB
        chargeStatus:
          type: string
          enum:
            - NO_CHARGE
            - RESERVED
            - PAID
            - NOT_CHARGED
            - PAYMENT_ERROR
          description: Статус работы с комиссией
          example: RESERVED
        _links:
          type: object
          minProperties: 1
          maxProperties: 3
          additionalProperties:
            $ref: '#/components/schemas/Link'
          description: Доступные действия с ресурсом

    Link:
      type: object
      additionalProperties: false
      required:
        - href
        - method
      properties:
        href:
          type: string
          minLength: 1
          maxLength: 2048
          description: Ссылка на ресурс
          example: /api/v1/billing-operations/billing-70001
        method:
          type: string
          enum:
            - GET
            - PATCH
          description: HTTP-метод
          example: GET

    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          minLength: 3
          maxLength: 64
          description: Код ошибки
          example: INVALID_REQUEST
        message:
          type: string
          minLength: 1
          maxLength: 500
          description: Описание ошибки
          example: Некорректные данные запроса

  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Операция не найдена
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Conflict:
      description: Конфликт при повторном использовании Idempotency-Key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unprocessable:
      description: Операция не может быть выполнена по бизнес-правилам
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    PreconditionFailed:
      description: If-Match не соответствует текущему ETag
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Locked:
      description: Ресурс заблокирован для изменения
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    PreconditionRequired:
      description: Не передан обязательный If-Match
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    TooManyRequests:
      description: Превышен лимит запросов
      headers:
        Retry-After:
          description: Через сколько секунд можно повторить запрос
          schema:
            type: integer
            minimum: 1
            default: 30
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    InternalError:
      description: Внутренняя ошибка сервиса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    ServiceUnavailable:
      description: Сервис временно недоступен
      headers:
        Retry-After:
          description: Через сколько секунд можно повторить запрос
          schema:
            type: integer
            minimum: 1
            default: 10
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    GatewayTimeout:
      description: Не получен ответ зависимого сервиса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'